<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>طير الغروب</title>
<meta name="theme-color" content="#1b1740">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
/* Layout: one full-height stage, a 9:16 canvas centered, scaled to fit. Single dusk look by choice. */
:root {
  --bg: #1b1740;
  --sky-top: #2b2a6b;
  --sky-mid: #c4577a;
  --sky-low: #ffb86b;
  --pillar: #3a2f5c;
  --pillar-lit: #5a4a85;
  --ink: #fff4e0;
  --bird: #ffd23f;
  --font: "Tajawal", "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: #1b1740; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
#stage { height: 100%; max-width: 100%; aspect-ratio: 9 / 16; }
canvas {
  display: block;
  height: 100%;
  max-width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 14px;
  outline: none;
}
canvas:focus-visible { outline: 3px solid var(--bird); outline-offset: 3px; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="لعبة الطير. اضغط أو المس الشاشة للقفز."></canvas></div>

<script>
(function () {
  var W = 360, H = 640, GROUND = 92;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var FONT = '"Tajawal","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif';
  if (document.fonts && document.fonts.load) {
    document.fonts.load('800 24px Tajawal').catch(function () {});
  }

  var best = 0;
  try { best = parseInt(localStorage.getItem('dusk-sparrow-best') || '0', 10) || 0; } catch (e) {}

  // ---- sound (starts after first tap) ----
  var actx = null;
  function beep(freq, dur, type, vol, slideTo) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.08, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---- state ----
  var GRAV = 0.38, FLAP = -6.9, SPEED = 2.3, GAP = 158, SPACING = 190, PW = 62, R = 13;
  var state = 'ready'; // ready | play | dead
  var bird, pipes, score, dist, groundX, deadTimer, flash, newBest;
  var clouds = [], stars = [];
  var i;
  for (i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 60 + Math.random() * 260, s: 0.6 + Math.random() * 0.9, v: 0.15 + Math.random() * 0.25 });
  for (i = 0; i < 40; i++) stars.push({ x: Math.random() * W, y: Math.random() * 250, r: Math.random() * 1.2 + 0.3, t: Math.random() * 6 });

  function reset() {
    bird = { x: 96, y: H / 2 - 40, vy: 0, rot: 0, wing: 0 };
    pipes = []; score = 0; dist = 0; groundX = 0; deadTimer = 0; flash = 0; newBest = false;
    spawn(W + 80);
  }
  function spawn(x) {
    var min = 100, max = H - GROUND - 100 - GAP;
    pipes.push({ x: x, top: min + Math.random() * (max - min), passed: false });
  }
  reset();

  function flap() {
    if (state === 'ready') { state = 'play'; }
    if (state === 'play') { bird.vy = FLAP; beep(520, 0.12, 'triangle', 0.07, 760); }
    else if (state === 'dead' && deadTimer > 40) { reset(); state = 'ready'; }
  }

  function die() {
    state = 'dead'; deadTimer = 0; flash = 1;
    beep(220, 0.35, 'sawtooth', 0.09, 70);
    if (score > best) {
      best = score; newBest = true;
      try { localStorage.setItem('dusk-sparrow-best', String(best)); } catch (e) {}
    }
  }

  // ---- update (fixed 60Hz step) ----
  function step() {
    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x -= clouds[c].v * (state === 'dead' ? 0.2 : 1);
      if (clouds[c].x < -90) { clouds[c].x = W + 60; clouds[c].y = 60 + Math.random() * 260; }
    }
    if (flash > 0) flash -= 0.06;
    bird.wing += state === 'dead' ? 0 : (state === 'ready' ? 0.18 : 0.35);

    if (state === 'ready') {
      bird.y = H / 2 - 40 + Math.sin(bird.wing * 0.6) * 8;
      groundX = (groundX + SPEED) % 24;
      return;
    }
    if (state === 'dead') {
      deadTimer++;
      bird.vy += GRAV * 1.3;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI / 2, bird.rot + 0.1);
      if (bird.y > H - GROUND - R) { bird.y = H - GROUND - R; bird.vy = 0; }
      return;
    }

    bird.vy += GRAV;
    bird.y += bird.vy;
    bird.rot = Math.max(-0.45, Math.min(1.1, bird.vy * 0.075));
    if (bird.y < R) { bird.y = R; bird.vy = 0; }

    groundX = (groundX + SPEED) % 24;
    dist += SPEED;
    for (var p = pipes.length - 1; p >= 0; p--) {
      var pp = pipes[p];
      pp.x -= SPEED;
      if (!pp.passed && pp.x + PW < bird.x - R) {
        pp.passed = true; score++;
        beep(880, 0.1, 'square', 0.04, 1180);
      }
      if (pp.x + PW < -10) pipes.splice(p, 1);
    }
    var last = pipes[pipes.length - 1];
    if (last.x < W - SPACING + 20) spawn(last.x + SPACING);

    // collisions
    if (bird.y + R >= H - GROUND) { bird.y = H - GROUND - R; die(); return; }
    for (var q = 0; q < pipes.length; q++) {
      var k = pipes[q];
      if (bird.x + R - 3 > k.x && bird.x - R + 3 < k.x + PW) {
        if (bird.y - R + 3 < k.top || bird.y + R - 3 > k.top + GAP) { die(); return; }
      }
    }
  }

  // ---- drawing ----
  function drawSky(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H - GROUND);
    g.addColorStop(0, '#1d1a52'); g.addColorStop(0.45, '#7a3f84'); g.addColorStop(0.8, '#e0667a'); g.addColorStop(1, '#ffb86b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t / 700 + st.t);
      ctx.fillStyle = '#fff4e0';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // sun
    var sg = ctx.createRadialGradient(250, H - GROUND - 70, 6, 250, H - GROUND - 70, 120);
    sg.addColorStop(0, 'rgba(255,236,170,1)'); sg.addColorStop(0.25, 'rgba(255,196,110,0.9)'); sg.addColorStop(1, 'rgba(255,150,100,0)');
    ctx.fillStyle = sg; ctx.fillRect(100, H - GROUND - 200, 300, 260);
    // clouds
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.fillStyle = 'rgba(255,214,200,0.22)';
      ctx.beginPath();
      ctx.ellipse(cl.x, cl.y, 38 * cl.s, 12 * cl.s, 0, 0, 6.283);
      ctx.ellipse(cl.x + 22 * cl.s, cl.y - 7 * cl.s, 26 * cl.s, 11 * cl.s, 0, 0, 6.283);
      ctx.ellipse(cl.x - 24 * cl.s, cl.y - 4 * cl.s, 22 * cl.s, 9 * cl.s, 0, 0, 6.283);
      ctx.fill();
    }
    // hills
    ctx.fillStyle = '#4a2a5e';
    ctx.beginPath(); ctx.moveTo(0, H - GROUND);
    for (var x = 0; x <= W; x += 10) ctx.lineTo(x, H - GROUND - 46 - Math.sin((x + dist * 0.15) / 52) * 18 - Math.sin((x + dist * 0.15) / 21) * 5);
    ctx.lineTo(W, H - GROUND); ctx.fill();
  }

  function drawPipe(p) {
    var CAP = 24, CAPX = 6;
    function body(y, h) {
      var g = ctx.createLinearGradient(p.x, 0, p.x + PW, 0);
      g.addColorStop(0, '#2e2450'); g.addColorStop(0.35, '#5a4a85'); g.addColorStop(1, '#2a2147');
      ctx.fillStyle = g; ctx.fillRect(p.x, y, PW, h);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (var yy = y + 14 - (y % 28); yy < y + h; yy += 28) if (yy > y) ctx.fillRect(p.x, yy, PW, 2);
    }
    function cap(y) {
      var g = ctx.createLinearGradient(p.x - CAPX, 0, p.x + PW + CAPX, 0);
      g.addColorStop(0, '#3a2f5c'); g.addColorStop(0.35, '#7461a8'); g.addColorStop(1, '#33294f');
      ctx.fillStyle = g; ctx.fillRect(p.x - CAPX, y, PW + CAPX * 2, CAP);
      ctx.fillStyle = 'rgba(255,184,107,0.5)'; ctx.fillRect(p.x - CAPX, y + (y < p.top ? CAP - 3 : 0), PW + CAPX * 2, 3);
    }
    body(0, p.top - CAP); cap(p.top - CAP);
    var by = p.top + GAP;
    body(by + CAP, H - GROUND - by - CAP); cap(by);
  }

  function drawGround() {
    var gy = H - GROUND;
    ctx.fillStyle = '#2a1d44'; ctx.fillRect(0, gy, W, GROUND);
    ctx.fillStyle = '#ffb86b'; ctx.fillRect(0, gy, W, 4);
    ctx.fillStyle = '#3b2a5c';
    for (var x = -24 + (-groundX); x < W + 24; x += 24) {
      ctx.beginPath(); ctx.moveTo(x, gy + 4); ctx.lineTo(x + 12, gy + 4); ctx.lineTo(x + 0, gy + 22); ctx.lineTo(x - 12, gy + 22); ctx.fill();
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
    // tail
    ctx.fillStyle = '#e8a317';
    ctx.beginPath(); ctx.moveTo(-10, 2); ctx.lineTo(-24, -4); ctx.lineTo(-22, 6); ctx.closePath(); ctx.fill();
    // body
    var bg = ctx.createRadialGradient(-3, -5, 2, 0, 0, 17);
    bg.addColorStop(0, '#ffe680'); bg.addColorStop(1, '#ffb400');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 14, 0, 0, 6.283); ctx.fill();
    // belly
    ctx.fillStyle = '#fff1c2';
    ctx.beginPath(); ctx.ellipse(3, 6, 10, 6, 0.1, 0, 6.283); ctx.fill();
    // wing
    var wy = Math.sin(bird.wing) * 7;
    ctx.fillStyle = '#e8860c';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-18, wy - 6, -2, wy + 8); ctx.quadraticCurveTo(2, 2, -8, 0); ctx.fill();
    // eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -5, 5, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1b1740'; ctx.beginPath(); ctx.arc(9.5, -5, 2.4, 0, 6.283); ctx.fill();
    // beak
    ctx.fillStyle = '#ff6b3d';
    ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(25, 2); ctx.lineTo(14, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || 800) + ' ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(20,10,40,0.55)';
    ctx.fillText(str, x + 2, y + 3);
    ctx.fillStyle = color || '#fff4e0';
    ctx.fillText(str, x, y);
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(0, 0, W, H, 14); else ctx.rect(0, 0, W, H);
    ctx.clip();
    drawSky(t);
    for (var p = 0; p < pipes.length; p++) drawPipe(pipes[p]);
    drawGround();
    drawBird();

    if (state === 'play') {
      text(String(score), W / 2, 74, 54, '#fff4e0');
    } else if (state === 'ready') {
      text('طير الغروب', W / 2, 150, 40, '#ffd23f');
      text('المس الشاشة للقفز', W / 2, 400, 24, '#fff4e0', 'center', 500);
      text('أفضل نتيجة: ' + best, W / 2, 440, 18, '#ffd9b0', 'center', 500);
    } else {
      ctx.fillStyle = 'rgba(20,10,40,0.45)'; ctx.fillRect(0, 0, W, H - GROUND);
      var bx = 40, by = 170, bw = W - 80, bh = 250;
      ctx.fillStyle = '#2a1d44'; ctx.strokeStyle = '#ffb86b'; ctx.lineWidth = 3;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 16); else ctx.rect(bx, by, bw, bh);
      ctx.fill(); ctx.stroke();
      text('انتهت اللعبة', W / 2, by + 44, 32, '#ffd23f');
      text('النتيجة', W / 2, by + 100, 18, '#ffd9b0', 'center', 500);
      text(String(score), W / 2, by + 140, 48, '#fff4e0');
      text('الأفضل: ' + best + (newBest ? '  ★ رقم جديد' : ''), W / 2, by + 190, 20, newBest ? '#ffd23f' : '#ffd9b0', 'center', 500);
      if (deadTimer > 40) text('المس للعب مرة ثانية', W / 2, by + 228, 16, '#fff4e0', 'center', 500);
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, flash) + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  // ---- loop ----
  var last = performance.now(), acc = 0, STEP = 1000 / 60;
  function frame(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= STEP) { step(); acc -= STEP; }
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- input ----
  var down = false;
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); canvas.focus(); flap(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  });
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
